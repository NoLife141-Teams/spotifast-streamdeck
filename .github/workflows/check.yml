name: Plugin checks

on:
  push:
    branches: [main]
    tags: ['v*']
  # Public repository: retain useful checks for every stacked PR target.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin_checks:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run validate
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check -- "$env:RELEASE_TAG"
      - run: npm run pack
      - run: npm run package:verify
      - if: startsWith(github.ref, 'refs/tags/v') && matrix.node == 20
        run: npm run release:prepare
      - if: startsWith(github.ref, 'refs/tags/v') && matrix.node == 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotifast-canonical-${{ github.sha }}
          path: |
            dist/rocks.spotifast.streamdeck.streamDeckPlugin
            dist/LICENSE
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/package-verification.json
          if-no-files-found: error
          retention-days: 7
  # Preserve the required "check" context while validating both supported runtimes.
  check:
    if: ${{ always() }}
    needs: plugin_checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PLUGIN_CHECKS_RESULT: ${{ needs.plugin_checks.result }}
        run: test "$PLUGIN_CHECKS_RESULT" = "success"
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spotifast-canonical-${{ github.sha }}
          path: release
          digest-mismatch: error
      - name: Verify canonical artifact checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Publish tested installer as a prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          rocks.spotifast.streamdeck.streamDeckPlugin LICENSE SHA256SUMS.txt
          RELEASE_NOTES.md package-verification.json
          --verify-tag --prerelease
          --title "Spotifast $RELEASE_TAG (beta)"
          --notes-file RELEASE_NOTES.md
